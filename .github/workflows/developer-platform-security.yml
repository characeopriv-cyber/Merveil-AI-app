name: Merveil Developer Platform Security

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'server/**'
      - 'public/developer-portal/**'
      - 'vercel.json'
      - '.github/workflows/developer-platform-security.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'server/**'
      - 'public/developer-portal/**'
      - 'vercel.json'
      - '.github/workflows/developer-platform-security.yml'

permissions:
  contents: read

jobs:
  security:
    name: Developer Platform security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan tracked Developer Platform files for secret material
        shell: bash
        run: |
          set -euo pipefail
          files=$(git ls-files -- 'api/**' 'server/**' 'public/developer-portal/**' 'vercel.json')
          if [ -z "$files" ]; then
            echo "No Developer Platform files found."
            exit 0
          fi

          if grep -nE 'BEGIN (RSA|OPENSSH|EC|DSA|PRIVATE) KEY' $files; then
            echo "Private key material detected in tracked Developer Platform files."
            exit 1
          fi

          if grep -nE '(^|/)(\.env|\.env\.[^/]+|credentials\.json|service-account\.json)$' <(printf '%s\n' $files); then
            echo "Secret-bearing file is tracked in the Developer Platform scope."
            exit 1
          fi

          echo "No private-key material or blocked secret-bearing files detected."

      - name: Check blocked execution paths are absent
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'child_process|execSync\(|spawnSync\(|exec\(|spawn\(' -- api server public/developer-portal ':!public/developer-portal/**/vendor/**' 2>/dev/null; then
            echo "Potential direct process execution found in the Developer Platform scope. Review required."
            exit 1
          fi
          echo "No direct process execution primitives found in the Developer Platform scope."
