name: Repair call authentication

on:
  push:
    paths:
      - '.github/workflows/repair-call-auth.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch router
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('api/router.js')
          s = p.read_text(encoding='utf-8')
          old = '''  if (resource === "calls" && action === "create" && method === "POST") {\n  // actorId = user || jwtSub — simplest path: any signed-in citizen can call.\n  if (!requireActor(res, "Sign in required.")) return;\n  const callerId = actorId;'''
          new = '''  if (resource === "calls" && action === "create" && method === "POST") {\n  // Preserve the established signed-in citizen session path for one-tap calls.\n  if (!citizen?.id) return sendJson(res, 401, { error: "Sign in required." });\n  const callerId = citizen.id;'''
          if old not in s:
              raise SystemExit('Call auth regression block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'Merveil CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/router.js
          git commit -m 'fix(calls): restore signed-in session auth path'
          git push
