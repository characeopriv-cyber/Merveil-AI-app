name: Merveil AI — Cloudflare Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_WORKER_NAME: merveil-ai-app-new

jobs:
  deploy:
    name: Build and deploy to Cloudflare Worker
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Merveil AI
        run: npm run build

      - name: Deploy with npx wrangler
        run: npx wrangler@latest deploy --config wrangler.jsonc --name "$CLOUDFLARE_WORKER_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
