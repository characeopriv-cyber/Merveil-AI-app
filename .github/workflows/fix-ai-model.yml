name: Fix AI model configuration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace retired xAI model fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('api/router.js')
          s = p.read_text()
          old = s
          s = s.replace('"grok-2-latest"', '"grok-4.6"')
          s = s.replace("'grok-2-latest'", "'grok-4.6'")
          if s == old:
              print('No retired grok-2-latest literal remains in router.js')
              raise SystemExit(0)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/router.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: replace retired Grok model fallback'
          git push
