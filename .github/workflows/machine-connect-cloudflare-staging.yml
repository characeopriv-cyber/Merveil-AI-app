name: Merveil AI — Machine Connect Cloudflare Staging

on:
  push:
    branches:
      - feature/machine-connect
    paths:
      - 'machine-connect/**'
      - 'src/worker.js'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/machine-connect-cloudflare-staging.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-machine-connect-staging
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_WORKER_NAME: merveil-ai-app-machine-connect-staging

jobs:
  validate-and-deploy:
    name: Build, validate and deploy Machine Connect staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Merveil AI + Machine Connect integration
        run: npm run build

      - name: Validate Cloudflare Worker bundle
        run: npx wrangler@latest deploy --dry-run --config wrangler.jsonc --name "$CLOUDFLARE_WORKER_NAME" --outdir .wrangler-dry-run

      - name: Deploy staging Worker
        run: npx wrangler@latest deploy --config wrangler.jsonc --name "$CLOUDFLARE_WORKER_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
