name: Merveil Developer Platform checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_production_e2e:
        description: 'Run the isolated F3 production E2E certification harness'
        required: true
        default: false
        type: boolean

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check server and API JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find api server lib -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Check Developer Platform browser JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find public/developer-portal -maxdepth 1 -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: F2 deterministic realization integration contract
        run: node tools/f2-integration-check.mjs
      - name: F3 production E2E harness (gated)
        if: github.event_name == 'workflow_dispatch' && inputs.run_production_e2e == true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          F3_BASE_URL: ${{ secrets.F3_BASE_URL }}
          F3_TEST_PASSWORD: ${{ secrets.F3_TEST_PASSWORD }}
          F3_CONFIRM_PRODUCTION: YES
        run: node tools/f3-production-e2e.mjs
      - name: Build production application
        run: npm run build
