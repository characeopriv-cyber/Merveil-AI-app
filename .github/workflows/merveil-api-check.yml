name: Merveil Developer Platform checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check server and API JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find api server lib -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Check Developer Platform browser JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find public/developer-portal -maxdepth 1 -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Build production application
        run: npm run build
