name: Merveil API checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check API JavaScript syntax
        shell: bash
        run: |
          set -e
          for f in api/v1/*.js; do node --check "$f"; done
      - name: Check developer console JavaScript syntax
        run: node --check developer-portal/console.js
