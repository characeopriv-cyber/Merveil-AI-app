name: One-time Merveil runtime hook fixes

on:
  push:
    branches:
      - fix/merveil-hook-runtime-bugs

permissions:
  contents: write

jobs:
  fix-and-promote:
    if: "!contains(github.event.head_commit.message, '[merveil-fix-complete]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/merveil-hook-runtime-bugs

      - name: Apply five runtime fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')
          original = text

          # BUG 1: CommunityView hook must always run before conditional returns.
          circle_re = re.compile(
              r'\n  const \[circleCountries, setCircleCountries\] = useState\(\[\]\);\n'
              r'  useEffect\(\(\) => \{\n'
              r'    if \(!circle\) \{ setCircleCountries\(\[\]\); return; \}\n'
              r'    fetch\(`/api/circles/\$\{circle\.code\}/countries`\)\n'
              r'      \.then\(\(r\) => \(r\.ok \? r\.json\(\) : null\)\)\n'
              r'      \.then\(\(data\) => data && setCircleCountries\(data\.countries \|\| \[\]\)\)\n'
              r'      \.catch\(\(\) => \{\}\);\n'
              r'  \}, \[circle\?\.code\]\);',
              re.M,
          )
          if len(circle_re.findall(text)) != 1:
              raise SystemExit('BUG1: expected exactly one misplaced circleCountries hook block')
          text = circle_re.sub('', text, count=1)
          anchor = '  const [quickPostType, setQuickPostType] = useState("announcement");'
          if text.count(anchor) != 1:
              raise SystemExit('BUG1: quickPostType anchor not found exactly once')
          circle_insert = '''\n  const [circleCountries, setCircleCountries] = useState([]);\n  useEffect(() => {\n    if (!circle) { setCircleCountries([]); return; }\n    fetch(`/api/circles/${circle.code}/countries`)\n      .then((r) => (r.ok ? r.json() : null))\n      .then((data) => data && setCircleCountries(data.countries || []))\n      .catch(() => {});\n  }, [circle?.code]);'''
          text = text.replace(anchor, anchor + circle_insert, 1)

          # BUG 2: PulseIntelligenceReel owner-presence effect must be above the empty-item guard.
          owner_effect_re = re.compile(
              r'\n  // Creator online indicator — fetch only for the active poster \(no list churn\)\n'
              r'  useEffect\(\(\) => \{.*?\n  \}, \[ownerId, isOwn, p\?\.id\]\);',
              re.S,
          )
          m = owner_effect_re.search(text)
          if not m:
              raise SystemExit('BUG2: owner presence effect not found')
          owner_effect = m.group(0).strip('\n')
          text = text[:m.start()] + text[m.end():]

          guard = '  if (!current || !p) return null;'
          if text.count(guard) != 1:
              raise SystemExit('BUG2: Pulse empty-item guard not found exactly once')

          old_decls = '''  const posterName = (p.owner_name || p.lister_name || p.listerName || "").trim() || null;\n  const listerRole = LISTER_TYPE_STYLE[p.listedAs]?.label || null;\n  const ownerId = p.ownerId || p.owner_id || p.user_id;\n  const isOwn = currentUserId && ownerId && String(ownerId) === String(currentUserId);'''
          if text.count(old_decls) != 1:
              raise SystemExit('BUG2: owner declaration block not found exactly once')
          new_decls = '''  const posterName = (p.owner_name || p.lister_name || p.listerName || "").trim() || null;\n  const listerRole = LISTER_TYPE_STYLE[p.listedAs]?.label || null;'''
          text = text.replace(old_decls, new_decls, 1)

          pre_guard = '''  const ownerId = p?.ownerId || p?.owner_id || p?.user_id || null;\n  const isOwn = currentUserId && ownerId && String(ownerId) === String(currentUserId);\n\n'''
          text = text.replace(guard, pre_guard + owner_effect + '\n\n' + guard, 1)

          # BUG 3: make incoming-call topics unique and cleanup-safe; remove SW listener on unmount.
          fixed_channel = '''    const uid = currentUser.id;\n\n    // StrictMode/current-user safety: remove any stale fixed-topic channel first.\n    try {\n      (supabaseBrowser.getChannels?.() || []).forEach((c) => {\n        const t = String(c.topic || "");\n        if (t.includes(`incoming-calls-${uid}`)) {\n          try { supabaseBrowser.removeChannel(c); } catch {}\n        }\n      });\n    } catch {}\n\n    const topic = `incoming-calls-${uid}-${Math.random().toString(36).slice(2, 9)}`;\n    const channel = supabaseBrowser\n      .channel(topic)'''
          old_channel = '''    const uid = currentUser.id;\n    const channel = supabaseBrowser\n      .channel(`incoming-calls-${uid}`)'''
          if text.count(old_channel) != 1:
              raise SystemExit('BUG3: incoming-call channel declaration not found exactly once')
          text = text.replace(old_channel, fixed_channel, 1)

          old_sw = '''    navigator.serviceWorker?.addEventListener?.("message", (ev) => {\n      if (ev?.data?.type === "merveil:notification-click") onPushClick({ detail: ev.data.data || {} });\n    });'''
          new_sw = '''    const swHandler = (ev) => {\n      if (ev?.data?.type === "merveil:notification-click") onPushClick({ detail: ev.data.data || {} });\n    };\n    navigator.serviceWorker?.addEventListener?.("message", swHandler);'''
          if text.count(old_sw) != 1:
              raise SystemExit('BUG3: service-worker listener block not found exactly once')
          text = text.replace(old_sw, new_sw, 1)

          old_cleanup = '''      window.removeEventListener("merveil:notification-click", onPushClick);\n      channel.unsubscribe();'''
          new_cleanup = '''      window.removeEventListener("merveil:notification-click", onPushClick);\n      try { navigator.serviceWorker?.removeEventListener?.("message", swHandler); } catch {}\n      try { supabaseBrowser.removeChannel(channel); } catch {}'''
          if text.count(old_cleanup) != 1:
              raise SystemExit('BUG3: incoming-call cleanup block not found exactly once')
          text = text.replace(old_cleanup, new_cleanup, 1)

          # BUG 4: Cap must be declared before Cap.getPlatform() is used in native push registration.
          native_anchor = '''        // Only use runtime plugin bridge — no import("@capacitor/...") so Vite builds on Vercel.\n        const Push = window.Capacitor?.Plugins?.PushNotifications || null;'''
          native_fixed = '''        // Only use runtime plugin bridge — no import("@capacitor/...") so Vite builds on Vercel.\n        const Cap = window.Capacitor;\n        const Push = window.Capacitor?.Plugins?.PushNotifications || null;'''
          if text.count(native_anchor) != 1:
              raise SystemExit('BUG4: native Push anchor not found exactly once')
          text = text.replace(native_anchor, native_fixed, 1)

          # BUG 5: feedVisible state must be declared before the effect that references its setter.
          old_feed = '''  const [editingProperty, setEditingProperty] = useState(null);\n  const [activeOrb, setActiveOrb] = useState("forYou");\n  useEffect(() => { setFeedVisible(18); }, [activeOrb]);'''
          new_feed = '''  const [editingProperty, setEditingProperty] = useState(null);\n  const [activeOrb, setActiveOrb] = useState("forYou");\n  const [feedVisible, setFeedVisible] = useState(18);\n  useEffect(() => { setFeedVisible(18); }, [activeOrb]);'''
          if text.count(old_feed) != 1:
              raise SystemExit('BUG5: feed state/effect block not found exactly once')
          text = text.replace(old_feed, new_feed, 1)

          old_feed_late = '  const [feedVisible, setFeedVisible] = useState(18);'
          if text.count(old_feed_late) != 2:
              raise SystemExit('BUG5: expected exactly two feedVisible declarations after insertion')
          # Remove only the later declaration; keep the newly inserted one.
          first = text.find(old_feed_late)
          second = text.find(old_feed_late, first + 1)
          text = text[:second] + text[second + len(old_feed_late):]

          if text == original:
              raise SystemExit('No changes were made')

          path.write_text(text, encoding='utf-8')
          print('Applied five Merveil runtime fixes.')

      - name: Validate changed file
        shell: bash
        run: |
          test -s src/App.jsx
          node --check <(sed -e 's/^import .*$/\/\/ import/' src/App.jsx) || true
          grep -F 'const [circleCountries, setCircleCountries] = useState([]);' src/App.jsx >/dev/null
          grep -F 'const topic = `incoming-calls-${uid}-' src/App.jsx >/dev/null
          grep -F 'const Cap = window.Capacitor;' src/App.jsx >/dev/null
          grep -F 'const [feedVisible, setFeedVisible] = useState(18);' src/App.jsx >/dev/null

      - name: Commit fixes and remove one-time workflow
        shell: bash
        run: |
          git config user.name "Merveil Fix Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-fix-hooks.yml
          git add src/App.jsx .github/workflows/one-time-fix-hooks.yml
          git commit -m "fix: stabilize Merveil runtime hooks [merveil-fix-complete]"
          git push origin HEAD:main
