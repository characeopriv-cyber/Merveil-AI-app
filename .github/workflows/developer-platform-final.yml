name: Merveil Developer Platform final verification

on:
  push:
    branches: [main]
    paths:
      - 'api/developer-health.js'
      - 'api/github-oauth.js'
      - 'server/github-provider.js'
      - 'public/developer-portal/developer-integration-finalizer.js'
      - 'public/developer-portal/config.js'
      - 'public/developer-portal/developer-health-ui.js'
      - 'public/developer-portal/developer-runtime.js'
      - 'public/developer-portal/pro-project-overlay.js'
  pull_request:
    paths:
      - 'api/developer-health.js'
      - 'api/github-oauth.js'
      - 'server/github-provider.js'
      - 'public/developer-portal/developer-integration-finalizer.js'
      - 'public/developer-portal/config.js'
      - 'public/developer-portal/developer-health-ui.js'
      - 'public/developer-portal/developer-runtime.js'
      - 'public/developer-portal/pro-project-overlay.js'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Check Developer Platform JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for dir in api server public/developer-portal; do
            if [ -d "$dir" ]; then
              find "$dir" -maxdepth 1 -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
            fi
          done
      - name: Production build
        run: npm run build
