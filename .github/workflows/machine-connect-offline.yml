name: Machine Connect Offline Validation

on:
  push:
    branches: [main]
    paths:
      - 'machine-connect/offline/**'
      - '.github/workflows/machine-connect-offline.yml'
  pull_request:
    paths:
      - 'machine-connect/offline/**'
      - '.github/workflows/machine-connect-offline.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate telemetry processor
        working-directory: machine-connect/offline/telemetry-processor
        run: npm install --no-audit --no-fund && npm run check

      - name: Validate simulator image inputs
        run: |
          python3 -m py_compile machine-connect/offline/simulator/sensor_simulator.py

      - name: Validate offline Compose configuration
        working-directory: machine-connect/offline
        run: docker compose config -q
