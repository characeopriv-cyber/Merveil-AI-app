name: Fix call auth gate

on:
  push:
    paths:
      - '.github/workflows/fix-call-auth-gate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Remove redundant call sign-in gates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text(encoding='utf-8')
          old = 'onClick={(e) => { e.stopPropagation(); currentUser ? onCall?.("voice") : onRequireSignIn?.(); }}'
          new = 'onClick={(e) => { e.stopPropagation(); onCall?.("voice"); }}'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 redundant call gates, found {count}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          print(f'Replaced {count} redundant call sign-in gates')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'Merveil CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx
          git commit -m 'fix(calls): remove redundant sign-in gate from call buttons'
          git push