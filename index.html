<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />

    <!-- Host-level safety redirect: this domain is a standalone Professional Service surface. -->
    <script>
      if (window.location.hostname === "professional-service.junction.technology") {
        window.location.replace("/professional-service-junction/index.html" + window.location.search + window.location.hash);
      }
    </script>

    <title>Merveil AI — Identity, network &amp; opportunity</title>
    <meta
      name="description"
      content="Merveil AI is the super-app for verified identity, global networking, careers, services, investment, and trusted connections — powered by your Passport."
    />
    <meta name="theme-color" content="#06B6D4" />
    <meta name="application-name" content="Merveil AI" />
    <meta name="apple-mobile-web-app-title" content="Merveil AI" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph — Facebook / Instagram / LinkedIn share card -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Merveil AI" />
    <meta property="og:title" content="Merveil AI — Identity, network & opportunity" />
    <meta
      property="og:description"
      content="One Passport. Real citizens. Jobs, services, investment, World reels, and trusted connections — not just property."
    />
    <meta property="og:url" content="https://www.junction.technology/" />
    <meta property="og:image" content="https://www.junction.technology/og-merveil.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Merveil AI — Identity, network & opportunity" />
    <meta
      name="twitter:description"
      content="Verified identity, careers, services, investment, and global networking in one super-app."
    />
    <meta name="twitter:image" content="https://www.junction.technology/og-merveil.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- Optional Stripe.js for in-app card confirm. Publishable key only (never secret). -->
    <script src="https://js.stripe.com/v3/" async></script>
  </head>
  <body style="margin:0;background:#0B1220;color:#E8EEF2">
    <!-- prevent-flash: dark shell until React paints intro / app (avoids greige blink) -->
    <style id="merveil-boot">html,body,#root{min-height:100%;background:#0B1220!important}</style>
    <div id="root"></div>
    <script>
      // Set from Vercel public env or replace at deploy. Never put sk_ keys here.
      window.__MERVEIL_STRIPE_PK = window.__MERVEIL_STRIPE_PK || "";
    </script>
    <script>
      // Defensive polyfills for odd mobile browsers (e.g. King Browser / some WebViews)
      // that throw "XHRInterface is not defined" when a script expects RN-style globals.
      (function () {
        try {
          if (typeof window.XHRInterface === "undefined") {
            window.XHRInterface = window.XMLHttpRequest || function () {};
          }
          if (typeof globalThis.XHRInterface === "undefined") {
            globalThis.XHRInterface = window.XHRInterface;
          }
          if (typeof window.XMLHttpRequest === "undefined" && typeof XMLHttpRequest !== "undefined") {
            window.XMLHttpRequest = XMLHttpRequest;
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Professional Services is a controlled beta surface. It appears after Interface,
      // but only a real Merveil admin session may enter; everyone else sees Coming Soon.
      (function () {
        const ID="merveil-professional-plus", CSS_ID="merveil-professional-plus-css";
        function css(){if(document.getElementById(CSS_ID))return;const s=document.createElement("style");s.id=CSS_ID;s.textContent=".merveil-ps-plus{display:flex;align-items:center;gap:10px;width:100%;margin-top:6px;padding:11px 14px;border:0;border-radius:14px;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}.merveil-ps-plus:hover{background:rgba(0,0,0,.05)}.merveil-ps-plus .ps-plus{font-size:10px;letter-spacing:.08em;padding:3px 6px;border-radius:999px;border:1px solid currentColor;opacity:.65}.merveil-ps-modal{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:rgba(15,15,15,.34);backdrop-filter:blur(8px)}.merveil-ps-modal>div{width:min(420px,calc(100vw - 36px));padding:26px;border-radius:24px;background:#f8f5ef;color:#20221f;box-shadow:0 24px 80px rgba(0,0,0,.2)}.merveil-ps-modal h2{margin:0 0 8px;font-size:24px;letter-spacing:-.04em}.merveil-ps-modal p{margin:0 0 18px;color:#716e67;line-height:1.55}.merveil-ps-modal button{border:0;border-radius:12px;padding:11px 15px;background:#20221f;color:#fff;font-weight:700;cursor:pointer}";document.head.appendChild(s)}
        function txt(e){return(e.innerText||e.textContent||"").trim().toLowerCase()}
        function find(){return Array.from(document.querySelectorAll("button,a,[role='button'],li")).find(e=>txt(e)==="interface"||txt(e).startsWith("interface\n"))}
        function modal(){if(document.getElementById("merveil-ps-modal"))return;const w=document.createElement("div");w.id="merveil-ps-modal";w.className="merveil-ps-modal";w.innerHTML='<div role="dialog" aria-modal="true"><h2>Professional Services</h2><p>Coming soon. Professional Services is currently in controlled access and is not open for general entry.</p><button type="button">Close</button></div>';w.onclick=e=>{if(e.target===w||e.target.tagName==="BUTTON")w.remove()};document.body.appendChild(w)}
        async function allowed(){try{const r=await fetch("/api/session?action=me",{credentials:"include",headers:{Accept:"application/json"}});if(!r.ok)return false;const j=await r.json();return !!(j?.user?.is_admin||j?.profile?.is_admin)}catch(_){return false}}
        function add(){css();if(document.getElementById(ID))return;const t=find();if(!t)return;const b=document.createElement("button");b.id=ID;b.className="merveil-ps-plus";b.type="button";b.innerHTML="<span>Professional Services</span><span class='ps-plus'>PLUS</span>";b.title="Professional Services — Coming Soon";b.onclick=async()=>{if(await allowed())location.href="/professional-service";else modal()};t.insertAdjacentElement("afterend",b)}
        new MutationObserver(add).observe(document.documentElement,{subtree:true,childList:true});[0,500,1500,3000].forEach(t=>setTimeout(add,t));
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
