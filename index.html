  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      #merveil-ai-call-launcher{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:2147483000;border:1px solid rgba(91,220,235,.35);background:rgba(7,17,24,.94);color:#e9fbff;border-radius:999px;padding:11px 15px;font:700 13px/1 system-ui,sans-serif;letter-spacing:.01em;box-shadow:0 10px 34px rgba(0,0,0,.35);backdrop-filter:blur(12px);cursor:pointer;display:none}
      #merveil-ai-call-launcher span{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5ee7b1;box-shadow:0 0 12px #5ee7b1;margin-right:8px}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <button id="merveil-ai-call-launcher" aria-label="Open Merveil AI Call"><span></span>AI Call</button>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (()=>{const b=document.getElementById('merveil-ai-call-launcher');let shown=false;const scan=()=>{const els=[...document.querySelectorAll('button,a,[role="button"]')];const hit=els.some(e=>/\bcalls?\b/i.test((e.textContent||'').trim()));if(hit&&!shown){b.style.display='block';shown=true}};b.onclick=()=>location.href='/ai-call.html';new MutationObserver(scan).observe(document.getElementById('root'),{childList:true,subtree:true});setTimeout(scan,900);})();
    </script>
  </body>
