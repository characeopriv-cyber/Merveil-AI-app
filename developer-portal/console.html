<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merveil Developer Platform</title><style>body{margin:0;background:#071017;color:#eef7fa;font:15px system-ui}main{max-width:1100px;margin:auto;padding:28px}.bar{display:flex;justify-content:space-between;align-items:center}.card{background:#0b1921;border:1px solid #17343e;border-radius:16px;padding:20px;margin:18px 0}.muted{color:#8faab2}button{background:#0ea5b7;color:#031014;border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;margin:4px}button.secondary{background:#17262e;color:#e5f5f8}input,textarea{width:100%;box-sizing:border-box;background:#061016;color:white;border:1px solid #23414a;border-radius:9px;padding:10px;margin:7px 0}textarea{min-height:230px;font-family:monospace}.row{display:flex;gap:10px;flex-wrap:wrap}.project{border:1px solid #1b3944;border-radius:12px;padding:14px;margin:8px 0}.log{white-space:pre-wrap;background:#050d12;padding:14px;border-radius:10px;color:#9dd9e2;font-family:monospace}.pill{color:#7ce3ed}</style></head><body><main><div class="bar"><div><b>MERVEIL</b><div class="muted">Developer Platform · Create → Build → Run → Test → Deploy → Publish</div></div><button onclick="newProject()">+ New project</button></div><div id="projects" class="card">Loading projects…</div><div id="workspace" class="card" style="display:none"><h2 id="title">Workspace</h2><div class="muted">Real project files stored in Merveil.</div><div id="files" class="row"></div><input id="path" value="index.html"><textarea id="code"></textarea><div><button onclick="save()">Save</button><button class="secondary" onclick="build()">Build</button><button onclick="deploy()">Deploy</button></div><div id="status" class="log">Ready.</div></div></main><script>let ps=[],p=null,fs=[];const $=x=>document.getElementById(x);async function api(a,o={}){let r=await fetch('/api/developer-projects?action='+a+(o.id?'&project_id='+o.id:''),{credentials:'include',headers:{'Content-Type':'application/json'},...o});let b=await r.json();if(!r.ok)throw Error(b.error||'request_failed');return b}async function load(){try{let b=await api('projects');ps=b.projects||[];render()}catch(e){$('projects').innerHTML='<h2>Developer Platform</h2><p class="muted">'+e.message+'. Sign in to Merveil first.</p>'}}function render(){$('projects').innerHTML='<h2>Projects</h2>'+ (ps.length?ps.map(x=>`<div class="project"><b>${esc(x.name)}</b> <span class="pill">${esc(x.status_label||x.stage||'created')}</span><br><button class="secondary" onclick="openP('${x.id}')">Open workspace</button></div>`).join(''):'<p class="muted">No projects yet.</p>')}function esc(x){return String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}async function newProject(){let n=prompt('Project name');if(!n)return;try{let b=await api('projects',{method:'POST',body:JSON.stringify({name:n,runtime:'static',entry:'index.html',template:'blank'})});ps.unshift(b.project);render();openP(b.project.id)}catch(e){alert(e.message)}}async function openP(id){p=ps.find(x=>x.id===id);$('workspace').style.display='block';$('title').textContent=p.name+' — Workspace';try{let b=await api('files',{id,method:'GET'});fs=b.files||[];renderFiles();if(fs[0])select(fs[0])}catch(e){$('status').textContent=e.message}}function renderFiles(){$('files').innerHTML=fs.map(f=>`<button class="secondary" onclick="selectBy('${f.id}')">${esc(f.path)}</button>`).join('')}function selectBy(id){select(fs.find(f=>f.id===id))}function select(f){$('path').value=f.path;$('code').value=f.content}async function save(){try{let b=await api('files',{id:p.id,method:'PUT',body:JSON.stringify({path:$('path').value,content:$('code').value})});let i=fs.findIndex(f=>f.path===b.file.path);i<0?fs.push(b.file):fs[i]=b.file;renderFiles();$('status').textContent='Saved '+b.file.path}catch(e){$('status').textContent=e.message}}async function build(){try{let b=await api('build',{id:p.id,method:'POST',body:'{}'});$('status').textContent=b.build.logs}catch(e){$('status').textContent=e.message}}async function deploy(){try{let b=await api('deploy',{id:p.id,method:'POST',body:'{}'});$('status').textContent=JSON.stringify(b.deployment,null,2);if(b.deployment?.url)window.open(b.deployment.url,'_blank')}catch(e){$('status').textContent=e.message}}load()</script></body></html>
