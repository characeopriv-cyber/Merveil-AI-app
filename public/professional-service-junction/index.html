<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Professional Service Junction — Merveil ecosystem professional services." />
  <title>Professional Service Junction</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8f9fc;
      color: #17202a;
      display: grid;
      place-items: center;
    }
    main { width: min(760px, 92vw); padding: 48px 28px; text-align: center; }
    .mark {
      width: 56px; height: 56px; margin: 0 auto 28px;
      border-radius: 18px; display: grid; place-items: center;
      background: white; box-shadow: 0 12px 40px rgba(20,30,45,.08);
      font-weight: 700; font-size: 24px;
    }
    h1 { margin: 0; font-size: clamp(34px, 6vw, 58px); letter-spacing: -.04em; }
    p { margin: 18px auto 0; max-width: 560px; font-size: 18px; line-height: 1.6; color: #66717d; }
    .status { margin-top: 28px; font-size: 13px; color: #7a8490; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">J</div>
    <h1>Professional Service Junction</h1>
    <p>A dedicated Merveil ecosystem surface for professional services.</p>
    <div class="status">Foundation route is live. Product experience will be built here.</div>
  </main>
</body>
</html>
