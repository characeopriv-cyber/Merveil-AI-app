<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>Merveil Developer</title><link rel="stylesheet" href="/developer-portal/developer-v6.css"></head><body><div id="app"></div><script type="module">
import {API_BASE} from './config.js';
const KEY='merveil_dev_projects_v5',ACTIVE='merveil_dev_active_v5';const s={page:1,project:null,file:null,messages:[],typing:false,recording:false,media:null,stream:null};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ps=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}};const save=x=>localStorage.setItem(KEY,JSON.stringify(x));
function load(){const a=ps(),id=localStorage.getItem(ACTIVE);s.project=a.find(x=>x.id===id)||null;if(s.project)s.file=Object.keys(s.project.files||{})[0]||null}
function create(prompt){const id='creation-'+Date.now().toString(36),name='Merveil creation',html='<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(name)+'</title><style>body{margin:0;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;background:#fff;color:#171717}main{max-width:760px;padding:48px;text-align:center}h1{font-size:48px;letter-spacing:-.05em;margin:0 0 14px}p{color:#666;line-height:1.6}</style></head><body><main><h1>'+esc(name)+'</h1><p>'+esc(prompt)+'</p></main></body></html>';s.project={id,name,tag:'Creation',desc:prompt,files:{'index.html':html},createdAt:Date.now(),updatedAt:Date.now(),generated:true};const a=ps();a.unshift(s.project);save(a);localStorage.setItem(ACTIVE,id);s.file='index.html';s.page=2;render()}
function rail(a){return '<aside class="rail"><button class="railBrand" id="homeBtn">M</button><button class="'+(a==='files'?'active':'')+'" data-nav="files">F</button><button class="'+(a==='preview'?'active':'')+'" data-nav="preview">P</button><button data-nav="validate">✓</button><button data-nav="ship">↑</button></aside>'}
function home(){return '<div class="home"><header class="homeHead"><span class="brand">Merveil Developer</span></header><main class="homeMain"><h1>What do you want to build?</h1><p>Start with an idea. Merveil helps turn it into a real creation.</p><div class="orbs"><button class="orb" id="discover"><strong>DISCOVER</strong><span>Find what to build</span></button><button class="orb" id="create"><strong>CREATE</strong><span>Describe your idea</span></button></div><form class="createBar" id="createForm"><textarea id="idea" placeholder="Describe what you want to build…"></textarea><button class="start">Start</button></form></main></div>'}
function result(){const p=s.project,h=p?.files?.['index.html'];return '<div class="page2">'+rail('preview')+'<section class="result"><header class="head"><strong>'+esc(p.name)+'</strong><span class="status">Creation ready</span><div class="actions"><button class="btn" id="studioBtn">Pro Studio</button><button class="btn primary" data-validate>Validate</button></div></header><div class="resultBody">'+(h?'<div class="preview"><iframe sandbox="allow-scripts" srcdoc="'+esc(h)+'"></iframe></div>':'<div class="empty"><h2>Your creation is alive.</h2><p>The project has no index.html yet.</p></div>')+'</div></section></div>'}
function studio(){const p=s.project,files=Object.keys(p.files||{}).sort();return '<div class="studio"><header class="studioHead"><span><b>'+esc(p.name)+'</b> <span class="path">/ '+esc(s.file||'project')+'</span></span><div class="right"><button class="btn" id="previewBtn">Preview</button><button class="btn" data-validate>Validate</button><button class="btn primary" id="shipBtn">Ship</button></div></header><aside class="files"><div class="filesHead">Files</div>'+files.map(f=>'<button class="file '+(f===s.file?'active':'')+'" data-file="'+esc(f)+'">'+esc(f)+'</button>').join('')+'</aside><main class="code"><div class="tabs"><button class="tab active">'+esc(s.file||'No file')+'</button></div><textarea class="editor" id="editor" spellcheck="false">'+esc(p.files[s.file]||'')+'</textarea></main>'+chat()+'</div>'}
function chat(){return '<aside class="chat"><header class="chatHead"><span class="dot"></span><div><b>Merveil</b><small>Engineering intelligence</small></div></header><div class="messages" id="messages">'+(s.messages.length?s.messages.map(m=>'<div class="msg '+(m.role==='user'?'user':'')+'">'+esc(m.text)+'</div>').join(''):'<div class="msg">I\'m here with the real project. Tell me what you want to change, fix, validate, or build next.</div>')+'</div>'+(s.typing?'<div class="typing">Merveil is working…</div>':'')+'<div class="attach" id="attach"></div><form class="chatForm" id="chatForm"><input id="fileInput" class="dv6-hidden" type="file" multiple><button class="iconBtn" id="upload" type="button">+</button><textarea class="chatInput" id="chatInput" rows="1" placeholder="Ask Merveil…"></textarea><button class="iconBtn" id="voice" type="button">◉</button><button class="iconBtn send" type="submit">↑</button></form></aside>'}
async function send(text){const p=s.project;s.messages.push({role:'user',text});s.typing=true;render();try{const files=Object.entries(p.files||{}).slice(0,30).map(([path,content])=>({path,content:String(content).slice(0,9000)}));const r=await fetch(API_BASE+'/api/engine/evolve',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({instruction:text,files})});const raw=await r.text();if(!r.ok)throw Error('Merveil returned HTTP '+r.status);const re=/<MF:BEGIN>\s*path:\s*([^\n]+)\s*\n<MF:BYTES>\s*\n([\s\S]*?)\n<MF:END>/g;let m,n=0;while((m=re.exec(raw))){const path=m[1].trim().replace(/^\/+|\.\.\//g,'');if(path){p.files[path]=m[2];n++}}p.updatedAt=Date.now();save(ps());s.messages.push({role:'m',text:n?'Done. I updated '+n+' real project file'+(n===1?'':'s')+'. Revalidate before shipping.':raw.slice(0,1200)||'I could not produce a project change.'})}catch(e){s.messages.push({role:'m',text:'I could not complete that request: '+e.message})}s.typing=false;render()}
function validate(){const p=s.project,h=p?.files?.['index.html'],issues=[];if(!h)issues.push('index.html is missing.');else['html','head','body'].forEach(t=>{if(!new RegExp('<'+t+'\\b','i').test(h))issues.push('index.html: missing <'+t+'>.')});s.messages.push({role:'m',text:issues.length?'Validation found '+issues.length+' issue(s):\n'+issues.join('\n'):'Validation passed for the basic project structure.'});render()}
function preview(){const h=s.project?.files?.['index.html'];if(h){const w=window.open('about:blank','_blank');if(w){w.document.write(h);w.document.close()}}}
async function voice(){if(s.recording){s.media?.stop();s.recording=false;s.stream?.getTracks().forEach(t=>t.stop());render();return}try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Voice recording is not available');s.stream=await navigator.mediaDevices.getUserMedia({audio:true});const c=[];s.media=new MediaRecorder(s.stream);s.media.ondataavailable=e=>e.data.size&&c.push(e.data);s.media.onstop=()=>{const b=new Blob(c,{type:'audio/webm'});s.messages.push({role:'m',text:'Voice message recorded ('+Math.ceil(b.size/1024)+' KB). It is recorded locally; provider-backed transcription is not claimed.'});render()};s.media.start();s.recording=true;render()}catch(e){s.messages.push({role:'m',text:'Voice recording failed: '+e.message});render()}}
function bind(){document.getElementById('createForm')?.addEventListener('submit',e=>{e.preventDefault();const v=document.getElementById('idea').value.trim();if(v)create(v)});document.getElementById('create')?.addEventListener('click',()=>document.getElementById('idea').focus());document.getElementById('discover')?.addEventListener('click',()=>{const x=document.getElementById('idea');x.value='Tell me about my world, skills, resources, problems and ambitions.';x.focus()});document.getElementById('homeBtn')?.addEventListener('click',()=>{s.page=1;render()});document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>b.dataset.nav==='preview'?(s.page=2,render()):b.dataset.nav==='files'?(s.page=3,render()):b.dataset.nav==='validate'?validate():alert('Ship requires successful validation and the real deployment flow.')));document.getElementById('studioBtn')?.addEventListener('click',()=>{s.page=3;render()});document.querySelectorAll('[data-validate]').forEach(b=>b.addEventListener('click',validate));document.getElementById('previewBtn')?.addEventListener('click',preview);document.getElementById('shipBtn')?.addEventListener('click',()=>alert('Ship is available after successful validation and real deployment credentials.'));document.querySelectorAll('[data-file]').forEach(b=>b.addEventListener('click',()=>{s.file=b.dataset.file;render()}));document.getElementById('editor')?.addEventListener('input',e=>{s.project.files[s.file]=e.target.value;s.project.updatedAt=Date.now();save(ps())});document.getElementById('chatForm')?.addEventListener('submit',e=>{e.preventDefault();const i=document.getElementById('chatInput'),v=i.value.trim();if(v){i.value='';send(v)}});document.getElementById('upload')?.addEventListener('click',()=>document.getElementById('fileInput').click());document.getElementById('fileInput')?.addEventListener('change',e=>{document.getElementById('attach').textContent=[...e.target.files].map(f=>f.name).join(', ')});document.getElementById('voice')?.addEventListener('click',voice)}
function render(){document.getElementById('app').innerHTML=s.page===1?home():s.page===2?result():studio();bind();const m=document.getElementById('messages');if(m)m.scrollTop=m.scrollHeight}load();render();
</script></body></html>
