<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merveil Studio — Build it deeper.</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--bg:#f2eee8;--surface:#f8f6f2;--line:#d8d0c6;--ink:#24232a;--muted:#77717a;--cyan:#22c8d1;--violet:#8066e8;--mint:#3aa77a;--coral:#ef8f73}*{box-sizing:border-box}body{margin:0;height:100vh;background:var(--bg);color:var(--ink);font:14px 'DM Sans',sans-serif;overflow:hidden}.top{height:58px;background:rgba(248,246,242,.94);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:18px}.back{color:var(--muted);text-decoration:none}.name{font:600 20px Fraunces,serif}.status{font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:99px}.spacer{flex:1}button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;font:500 13px 'DM Sans';cursor:pointer}button.primary{background:linear-gradient(120deg,var(--cyan),var(--violet));border:0;color:#fff}button:disabled{opacity:.45;cursor:not-allowed}.workspace{height:calc(100vh - 58px);display:grid;grid-template-columns:220px minmax(360px,1fr) 360px;gap:1px}.panel{background:var(--surface);min-width:0;display:flex;flex-direction:column}.head{height:42px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:12px;color:var(--muted)}.files{padding:8px}.file{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;color:var(--ink);padding:9px}.file.active{background:rgba(34,200,209,.1);color:#159ca5}.editor{flex:1;background:#20232a;color:#e8edf5;border:0;outline:0;resize:none;padding:16px;font:13px/1.6 'JetBrains Mono',monospace;tab-size:2}.foot{height:34px;border-top:1px solid #343840;background:#20232a;color:#9ca5b3;padding:8px 12px;font:11px 'JetBrains Mono'}.right{padding:0}.chat{flex:0 0 230px;padding:14px;overflow:auto}.msg{max-width:90%;padding:11px 13px;border-radius:14px;margin-bottom:10px;line-height:1.5}.msg.m{background:#eee9e2;border:1px solid var(--line)}.composer{display:flex;gap:7px;padding:10px;border-top:1px solid var(--line)}.composer input{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 10px;outline:none}.preview{margin:0 10px 10px;flex:1;min-height:180px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.preview-head{height:32px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}iframe{width:100%;height:calc(100% - 32px);border:0;background:#fff}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:900px){.workspace{grid-template-columns:170px 1fr}.right{display:none}}@media(max-width:620px){.workspace{grid-template-columns:1fr}.files{display:none}.top{padding:0 10px}.name{font-size:18px}.top button:not(.primary){display:none}}
</style></head><body><header class="top"><a class="back" href="/developer-portal/beginner.html">‹ Merveil</a><span class="name" id="title">Studio</span><span class="status" id="status">Draft</span><span class="spacer"></span><button id="validate">Validate</button><button class="primary" id="ship" disabled>Ready to Ship</button></header><main class="workspace"><aside class="panel files"><div class="head">Files</div><button class="file active">⌁ index.html</button><button class="file">◌ README.md</button></aside><section class="panel"><div class="head"><span>index.html</span><span>Real source</span></div><textarea class="editor" id="editor" spellcheck="false"></textarea><div class="foot" id="foot">Not validated</div></section><aside class="panel right"><div class="head"><div><b>Merveil</b><br><small>Build it deeper.</small></div><span>◉</span></div><div class="chat" id="chat"><div class="msg m">I’m beside you. Edit the real source, then validate it.</div></div><div class="composer"><input id="command" placeholder="Ask Merveil to change something…"><button id="apply">Apply</button></div><div class="preview"><div class="preview-head">Live preview</div><iframe id="preview" sandbox="allow-scripts allow-forms"></iframe></div></aside></main><script>
const editor=document.getElementById('editor'),preview=document.getElementById('preview'),foot=document.getElementById('foot'),ship=document.getElementById('ship'),title=document.getElementById('title'),chat=document.getElementById('chat');let html=localStorage.getItem('merveil_studio_html_v1')||'';title.textContent=localStorage.getItem('merveil_studio_title_v1')||'Studio';if(!html){html='<!doctype html><html><body style="font-family:system-ui;padding:48px"><h1>Your creation will appear here.</h1><p>Return to Create and generate a real project first.</p></body></html>'}editor.value=html;preview.srcdoc=html;function add(text){const d=document.createElement('div');d.className='msg m';d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}document.getElementById('validate').onclick=()=>{const value=editor.value;const checks=[['HTML document',/<html[\s>]/i.test(value)],['Head',/<head[\s>]/i.test(value)],['Body',/<body[\s>]/i.test(value)],['Balanced scripts', (value.match(/<script/gi)||[]).length>=(value.match(/<\/script>/gi)||[]).length]];const ok=checks.every(x=>x[1]);foot.textContent=(ok?'Validated · real source checks passed':'Needs attention · '+checks.filter(x=>!x[1]).map(x=>x[0]).join(', '));foot.style.color=ok?'#3aa77a':'#ef8f73';ship.disabled=!ok;if(ok)add('Validation passed. The project is ready for the next shipping step.');else add('I found an issue in the source. Fix it, then validate again.');};document.getElementById('apply').onclick=()=>{const q=document.getElementById('command').value.trim();if(!q)return;add('I’ll apply that change in Studio when the project edit action is available.');document.getElementById('command').value=''};editor.oninput=()=>{html=editor.value;localStorage.setItem('merveil_studio_html_v1',html);preview.srcdoc=html;foot.textContent='Unsaved source change';ship.disabled=true};if(new URLSearchParams(location.search).get('validate')==='1')document.getElementById('validate').click();
</script></body></html>
