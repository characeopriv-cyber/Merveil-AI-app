<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#faf8f4" />
  <meta name="description" content="Merveil Studio — describe it, and Merveil AI builds, ships and hosts it." />
  <title>Merveil Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/developer-portal/studio.css" />
  <link rel="stylesheet" href="/developer-portal/home-intelligence.css" />
  <link rel="stylesheet" href="/developer-portal/debug-circle.css" />
  <style>
    .mlh{margin:0 auto;padding:22px 28px 0;max-width:1380px}.mlh-top{display:flex;justify-content:space-between;gap:20px;align-items:center;border:1px solid var(--line);background:rgba(255,255,255,.72);border-radius:24px;padding:18px 20px;box-shadow:0 12px 35px rgba(20,18,12,.06)}.mlh-profile{display:flex;align-items:center;gap:15px;min-width:0}.mlh-avatar{width:64px;height:64px;border-radius:20px;overflow:hidden;background:var(--paper-3);display:grid;place-items:center;font-size:24px;font-weight:800;flex:0 0 auto}.mlh-avatar img{width:100%;height:100%;object-fit:cover}.mlh-kicker,.mlh-card small{font:600 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}.mlh-identity h2{font-size:23px;line-height:1.1;margin:5px 0}.mlh-identity p{color:var(--ink-2);margin:0}.mlh-badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.mlh-badges span{border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:11px;background:var(--paper-2)}.mlh-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.mlh button{font:600 12px var(--font);border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 11px;cursor:pointer}.mlh button:hover{transform:translateY(-1px);border-color:var(--line-2)}.mlh-actions b{margin-left:5px}.mlh-grid{display:grid;grid-template-columns:1.35fr .8fr 1fr;gap:14px;margin-top:14px}.mlh-card{border:1px solid var(--line);background:rgba(255,255,255,.82);border-radius:20px;padding:17px;min-height:250px}.mlh-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:13px}.mlh-card h3{font-size:18px;margin-top:5px}.mlh-card h3 em{font-style:normal;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:3px 6px;margin-left:5px;color:var(--ink-3)}.mlh-project-list{display:grid;gap:7px}.mlh-project{display:grid!important;grid-template-columns:35px 1fr auto;align-items:center;text-align:left;width:100%;background:var(--paper-2)!important}.mlh-project-mark{width:30px;height:30px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center}.mlh-project b,.mlh-project small{display:block}.mlh-project small{margin-top:2px;color:var(--ink-3)}.mlh-project i{font-style:normal}.mlh-empty{padding:24px 10px;color:var(--ink-3);text-align:center}.mlh-stat{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.mlh-stat span{color:var(--ink-2)}.mlh-wide{width:100%;margin-top:13px}.mlh-integration-list{display:grid;grid-template-columns:1fr 1fr;gap:7px}.mlh-integration{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:7px;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--paper-2)}.mlh-integration b,.mlh-integration small{display:block;font-size:11px}.mlh-integration small{color:var(--ink-3)}.mlh-integration button{padding:6px 7px;font-size:10px}.mlh-icon{width:25px;height:25px;border-radius:7px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:800}.mlh-note{margin-top:11px;color:var(--ink-3);font-size:11px}.mlh-integrations{min-width:0}@media(max-width:1050px){.mlh-grid{grid-template-columns:1fr 1fr}.mlh-integrations{grid-column:1/-1}}@media(max-width:700px){.mlh{padding:12px 12px 0}.mlh-top{align-items:flex-start;flex-direction:column}.mlh-actions{justify-content:flex-start}.mlh-grid{grid-template-columns:1fr}.mlh-integrations{grid-column:auto}.mlh-integration-list{grid-template-columns:1fr}.mlh-avatar{width:52px;height:52px;border-radius:16px}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="/developer-portal/session-guard.js"></script>
  <script src="/developer-portal/runtime-error-monitor.js"></script>
  <script type="module" src="/developer-portal/studio.js"></script>
  <script src="/developer-portal/interface-publish-control.js"></script>
  <script src="/developer-portal/home-enhancer.js"></script>
  <script src="/developer-portal/debug-circle.js"></script>
</body>
</html>
