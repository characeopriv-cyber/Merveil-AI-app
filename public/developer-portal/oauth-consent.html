<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merveil AI — Authorize Application</title><link rel="icon" type="image/svg+xml" href="/merveil-mark.svg?v=1"><link rel="shortcut icon" href="/merveil-mark.svg?v=1"><style>body{margin:0;background:#07090f;color:#eef2ff;font:15px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.box{width:min(520px,calc(100% - 32px));padding:28px;border:1px solid #202638;border-radius:18px;background:#0d111b;box-sizing:border-box}.brand{font-weight:800;letter-spacing:.18em}.muted{color:#8f99ad}.scope{padding:10px 12px;border:1px solid #202638;border-radius:10px;margin:7px 0}.btn{border:0;border-radius:10px;padding:12px 16px;background:#fff;color:#080a10;font-weight:700;cursor:pointer}.btn.secondary{background:#171d2b;color:#eef2ff}.actions{display:flex;gap:10px;margin-top:20px}.error{color:#ff8e8e}.hidden{display:none}input{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #283044;background:#090d15;color:#fff;margin:6px 0 12px}</style></head><body><main class="box"><div class="brand">MERVEIL</div><h1>Authorize application</h1><div id="app"><p class="muted">Loading secure authorization…</p></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.102.0';const root=document.getElementById('app');const qs=new URLSearchParams(location.search);const api='/api/v1/oauth';let sb,session;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function config(){const r=await fetch('/api/v1/developer/config');const j=await r.json();if(!r.ok)throw Error(j.message||j.error||'Configuration unavailable');sb=createClient(j.data.supabase_url,j.data.supabase_publishable_key,{auth:{persistSession:true,autoRefreshToken:true}});session=(await sb.auth.getSession()).data.session}function login(){root.innerHTML='<p class="muted">Sign in to continue. Your Merveil account will be asked to approve the permissions requested by this application.</p><form id="f"><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required><button class="btn">Sign in</button><div id="m"></div></form>';document.getElementById('f').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),m=document.getElementById('m');m.className='muted';m.textContent='Signing in…';const{error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error){m.className='error';m.textContent=error.message}else{session=(await sb.auth.getSession()).data.session;render()}}}function render(){if(!session)return login();const redirect=qs.get('redirect_uri')||'';const scope=(qs.get('scope')||'').split(/\s+/).filter(Boolean);root.innerHTML=`<p class="muted">You are signed in as <b>${esc(session.user.email)}</b>.</p><p>This application is requesting access to your Merveil account:</p>${scope.map(s=>`<div class="scope">${esc(s)}</div>`).join('')}<div class="actions"><button class="btn secondary" id="deny">Deny</button><button class="btn" id="allow">Allow access</button></div><div id="m"></div>`;document.getElementById('deny').onclick=()=>{if(redirect){const u=new URL(redirect);u.searchParams.set('error','access_denied');if(qs.get('state'))u.searchParams.set('state',qs.get('state'));location.assign(u.toString())}};document.getElementById('allow').onclick=authorize}async function authorize(){const p=new URLSearchParams(qs);p.set('format','json');const r=await fetch(api+'?'+p,{headers:{Authorization:`Bearer ${session.access_token}`}});const j=await r.json();if(!r.ok){document.getElementById('m').className='error';document.getElementById('m').textContent=j.message||j.error||'Authorization failed';return}const u=new URL(j.redirect_uri);u.searchParams.set('code',j.code);if(j.state)u.searchParams.set('state',j.state);location.assign(u.toString())}try{await config();render()}catch(e){root.innerHTML=`<p class="error">${esc(e.message)}</p>`}</script></body></html>
