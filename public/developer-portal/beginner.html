<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f5f1" />
  <title>Merveil — What will you build?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Unbounded:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/developer-portal/beginner.css" />
  <link rel="stylesheet" href="/developer-portal/beginner-v9.css" />
</head>
<body>
  <div id="app">
    <div style="min-height:100vh;display:grid;place-items:center;font-family:Manrope,system-ui,sans-serif;background:#f7f5f1;color:#12141a;padding:24px;text-align:center">
      <div><div style="width:40px;height:40px;border-radius:12px;background:#0a0b0f;color:#3fe0e8;display:grid;place-items:center;margin:0 auto 14px;font-weight:800">M</div><p style="margin:0;font-weight:600">Loading Developer…</p></div>
    </div>
  </div>
  <script type="module" src="/developer-portal/beginner.js"></script>
  <script src="/developer-portal/merveil-shortcuts.js"></script>
  <script>
    window.addEventListener('error', function(e) {
      var app = document.getElementById('app');
      if (!app || app.querySelector('.home,.nav,.result-shell')) return;
      app.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui;background:#f7f5f1;color:#12141a;text-align:center"><div><h1 style="font-size:18px;margin:0 0 8px">Developer failed to load</h1><p style="color:#5c6370;font-size:14px;max-width:360px">' + (e.message || 'Script error') + '</p><p style="margin-top:16px"><a href="/developer" style="color:#1ab8c0">Retry</a></p></div></div>';
    }, true);
  </script>
</body>
</html>
