<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#eee8df" />
  <title>Merveil — Describe your idea.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/developer-portal/beginner.css" />
  <link rel="stylesheet" href="/developer-portal/beginner-v9.css" />
  <link rel="stylesheet" href="/developer-portal/beginner-conversation.css" />
  <link rel="stylesheet" href="/developer-portal/beginner-living.css" />
</head>
<body>
  <div id="app">
    <div style="min-height:100vh;display:grid;place-items:center;font-family:'DM Sans',system-ui,sans-serif;background:#eee8df;color:#29252a;padding:24px;text-align:center">
      <div><div style="width:40px;height:40px;border-radius:50%;background:#151417;color:#35dce3;display:grid;place-items:center;margin:0 auto 14px;font-weight:700">M</div><p style="margin:0;font-weight:600">Merveil</p></div>
    </div>
  </div>
  <script type="module" src="/developer-portal/beginner.js"></script>
  <script src="/developer-portal/merveil-shortcuts.js"></script>
  <script src="/developer-portal/beginner-conversation.js"></script>
  <script src="/developer-portal/beginner-living.js"></script>
  <script>
    window.addEventListener('error', function(e) {
      var app = document.getElementById('app');
      if (!app || app.querySelector('.home,.nav,.result-shell')) return;
      app.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui;background:#eee8df;color:#29252a;text-align:center"><div><h1 style="font-size:18px;margin:0 0 8px">Merveil could not open this space</h1><p style="color:#776f76;font-size:14px;max-width:360px">' + (e.message || 'Script error') + '</p><p style="margin-top:16px"><a href="/developer" style="color:#168d94">Return to Merveil</a></p></div></div>';
    }, true);
  </script>
</body>
</html>
