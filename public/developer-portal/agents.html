<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Merveil · Agents</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/developer-portal/studio.css" />
  <style>
    .ag-root{max-width:960px;margin:0 auto;padding:20px}
    .ag-chat{background:#fff;border:1px solid var(--line);border-radius:16px;min-height:420px;display:flex;flex-direction:column}
    .ag-body{flex:1;padding:16px;overflow:auto;background:var(--paper)}
    .ag-bub{max-width:80%;padding:10px 14px;border-radius:12px;margin:8px 0;font-size:14px;line-height:1.55;white-space:pre-wrap}
    .ag-bub.u{background:linear-gradient(120deg,var(--mv-cyan,#00b8d4),#0097a7);color:#fff;margin-left:auto}
    .ag-bub.a{background:#fff;border:1px solid var(--line)}
    .ag-in{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
    .ag-in input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/developer-portal/agents.js"></script>
</body>
</html>
