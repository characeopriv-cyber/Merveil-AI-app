<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a0b0f" />
  <title>Merveil · Onboarding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/developer-portal/console.css" />
  <style>
    .onb-wrap{max-width:720px;margin:0 auto;padding:32px 20px 80px}
    .onb-hero{text-align:center;margin-bottom:32px}
    .onb-hero .orb{width:64px;height:64px;border-radius:50%;background:var(--grad);margin:0 auto 16px;box-shadow:0 0 40px rgba(124,92,255,.5)}
    .onb-hero h1{font-size:26px;margin:0 0 8px}
    .onb-hero p{color:var(--txt-2);font-size:14px;max-width:520px;margin:0 auto}
    .onb-steps{display:flex;gap:8px;justify-content:center;margin-bottom:28px;flex-wrap:wrap}
    .onb-step{padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;background:var(--bg-2);border:1px solid var(--line);color:var(--txt-3)}
    .onb-step.on{background:var(--grad);border-color:transparent;color:#fff}
    .onb-step.done{border-color:var(--acc-3);color:var(--acc-3)}
    .onb-card{background:var(--bg-1);border:1px solid var(--line-2);border-radius:18px;padding:26px;box-shadow:var(--shadow)}
    .onb-card h2{font-size:18px;margin:0 0 6px}
    .onb-card p.hint{color:var(--txt-3);font-size:13px;margin:0 0 20px}
    .onb-field{margin-bottom:16px}
    .onb-field label{display:block;font-size:12px;font-weight:600;color:var(--txt-2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
    .onb-field input,.onb-field select,.onb-field textarea{width:100%;padding:11px 13px;border-radius:11px;background:var(--bg);border:1px solid var(--line-2);color:var(--txt);font-size:14px;outline:none;transition:.15s;font-family:inherit}
    .onb-field input:focus,.onb-field select:focus,.onb-field textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(124,92,255,.15)}
    .onb-field textarea{min-height:90px;resize:vertical}
    .onb-chips{display:flex;gap:8px;flex-wrap:wrap}
    .onb-chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--bg-2);font-size:12.5px;color:var(--txt-2);cursor:pointer;transition:.15s}
    .onb-chip:hover{border-color:var(--acc);color:var(--txt)}
    .onb-chip.on{background:var(--grad);border-color:transparent;color:#fff}
    .onb-actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
    .onb-progress{height:4px;background:var(--bg-3);border-radius:999px;overflow:hidden;margin-bottom:24px}
    .onb-progress > div{height:100%;background:var(--grad);transition:width .35s ease;border-radius:999px}
    .onb-summary{background:var(--bg-2);border:1px solid var(--line-2);border-radius:12px;padding:14px;font-size:13px;color:var(--txt-2);line-height:1.7}
    .onb-summary strong{color:var(--txt)}
  </style>
</head>
<body>
  <div class="onb-wrap">
    <div class="onb-hero">
      <div class="orb"></div>
      <h1>Welcome to Merveil Developer</h1>
      <p>Three minutes to set up your Command Center. Your AI co-pilot will use this to build, deploy, and ship anything you imagine.</p>
    </div>
    <div class="onb-steps" id="onb-steps"></div>
    <div class="onb-progress"><div id="onb-bar" style="width:0%"></div></div>
    <div id="onb-body"></div>
  </div>
  <script type="module" src="/developer-portal/onboarding-panel.js"></script>
</body>
</html>
