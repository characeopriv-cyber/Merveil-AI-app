<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f4ef">
<title>Merveil Debug</title>
<style>body{margin:0;background:#f7f4ef;color:#242321;font:15px Inter,system-ui,sans-serif}.wrap{max-width:980px;margin:auto;padding:28px}.card{background:#fffdf9;border:1px solid #e6dfd5;border-radius:24px;padding:28px;box-shadow:0 12px 40px #0000000b}a{color:inherit;text-decoration:none}.back{display:inline-block;margin-bottom:24px}.orb{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff,#ddd4c8);font-size:30px}h1{margin:14px 0 8px}p{color:#6e6962;line-height:1.6}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}button,a.btn{border:1px solid #d9d0c5;background:#fff;border-radius:999px;padding:11px 16px;cursor:pointer}.primary{background:#242321!important;color:white}.out{margin-top:22px;padding:18px;border-radius:16px;background:#f3efe9;white-space:pre-wrap;min-height:100px}</style>
</head><body><main class="wrap"><a class="back" href="/developer">← Developer Home</a><section class="card"><div class="orb">⌁</div><h1>Debug</h1><p>Inspect a Developer project and surface structural issues before shipping. This room uses the same project space as Pro Studio.</p><div class="actions"><a class="btn" href="/developer/pro">Open Pro Studio</a><button class="primary" id="run">Run project check</button></div><div class="out" id="out">Ready. Select a project from Pro Studio to run a detailed check.</div></section></main><script>document.getElementById('run').onclick=()=>{let p;try{p=JSON.parse(localStorage.getItem('merveil_dev_projects_v5')||'[]')}catch{p=[]}let n=p.length,files=p.reduce((s,x)=>s+Object.keys(x.files||{}).length,0);document.getElementById('out').textContent=`Project space check\n\nProjects: ${n}\nFiles: ${files}\nIdentity: ${localStorage.getItem('merveil_digital_passport_v1')?'Passport present':'Passport not found'}\n\nOpen Pro Studio for file-level debugging and live editing.`};</script></body></html>
