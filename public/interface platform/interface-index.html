<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#121a26">
  <meta name="description" content="Merveil Interface Platform — UX, journeys, Store, Developer.">
  <title>Merveil — Interface Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/interface/interface.css">
</head>
<body>
  <div id="app">
    <div style="min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui;color:#6b7280;background:#f4f1ea;padding:24px;text-align:center">
      <div>
        <div style="width:40px;height:40px;border-radius:12px;background:#121a26;color:#a5b4fc;display:grid;place-items:center;margin:0 auto 14px;font-weight:800">I</div>
        <p style="margin:0;font-weight:600;color:#111827">Loading Merveil Interface…</p>
        <p style="margin:10px 0 0;font-size:13px">If this stays blank, hard-refresh or open <a href="/interface/" style="color:#6366f1">/interface/</a></p>
      </div>
    </div>
  </div>
  <script type="module" src="/interface/interface.js"></script>
  <script>
    window.addEventListener('error', function (e) {
      var app = document.getElementById('app');
      if (!app || app.querySelector('.shell,.nav-item,.product-title')) return;
      app.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui;background:#f4f1ea;color:#111;text-align:center"><div><h1 style="font-size:18px;margin:0 0 8px">Interface failed to load</h1><p style="color:#6b7280;font-size:14px">' + (e.message || 'Script error') + '</p><p style="margin-top:14px"><a href="/interface/" style="color:#6366f1">Retry</a> · <a href="/developer" style="color:#6366f1">Developer</a></p></div></div>';
    }, true);
  </script>
</body>
</html>
