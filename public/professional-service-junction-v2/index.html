<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Merveil Professional — Citizen Passport</title>
<meta name="theme-color" content="#f4efe7">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f4efe7;color:#20221f;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}.shell{min-height:100vh;background:radial-gradient(circle at 8% 0%,#fff 0,#f4efe7 38%,#eee7dc 100%)}
.top{height:76px;border-bottom:1px solid rgba(32,34,31,.09);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;background:rgba(248,245,239,.9);backdrop-filter:blur(18px);z-index:5}
.brand{font-weight:800;letter-spacing:-.04em}.brand span{font-weight:500;color:#77746d}.status{font-size:12px;color:#68655e;display:flex;gap:8px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:#7aa88d}
.body{display:grid;grid-template-columns:230px minmax(0,900px);gap:0;max-width:1280px;margin:auto;min-height:calc(100vh - 76px)}
.side{padding:28px 18px;border-right:1px solid rgba(32,34,31,.08)}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;text-align:left;color:#77746d;padding:12px 14px;border-radius:13px;cursor:pointer}.nav button.active,.nav button:hover{background:#fff;color:#20221f;box-shadow:0 5px 20px rgba(45,39,30,.06)}
.passport-mini{margin-top:28px;padding:16px;border:1px solid rgba(32,34,31,.1);background:rgba(255,255,255,.6);border-radius:18px}.avatar{width:44px;height:44px;border-radius:14px;background:#e8e0d3;display:grid;place-items:center;font-weight:800;margin-bottom:12px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.muted{color:#77746d;font-size:12px;line-height:1.55}
.main{padding:36px 34px;width:100%}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8a867d}.hero h1{font-size:40px;line-height:1.02;margin:8px 0 0;letter-spacing:-.055em;font-weight:760}.pill{border:1px solid rgba(32,34,31,.1);background:#fff;border-radius:999px;padding:9px 13px;color:#66635d;font-size:12px}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:15px}.card{border:1px solid rgba(32,34,31,.1);background:rgba(255,255,255,.78);border-radius:22px;padding:21px;box-shadow:0 14px 45px rgba(53,46,35,.06)}.card h3{margin:0 0 14px;font-size:14px}.identity{display:flex;gap:16px;align-items:center}.bigavatar{width:78px;height:78px;border-radius:23px;background:#e9e1d5;display:grid;place-items:center;font-size:25px;font-weight:800;overflow:hidden}.bigavatar img{width:100%;height:100%;object-fit:cover}.name{font-size:25px;font-weight:800;letter-spacing:-.04em}.meta{margin-top:5px;color:#77746d;font-size:13px}.badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}.badge{font-size:11px;padding:6px 9px;border-radius:999px;background:#f2eee7;border:1px solid rgba(32,34,31,.07);color:#65625b}.good{background:#edf6ef;color:#52745d}
.rows{margin-top:18px}.row{display:flex;justify-content:space-between;gap:20px;padding:11px 0;border-top:1px solid rgba(32,34,31,.07);font-size:12px}.row:first-child{border-top:0}.value{text-align:right;color:#5f5c56;max-width:60%;word-break:break-word}
.section{margin-top:15px}.section p{margin:6px 0 14px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:9px 11px;border-radius:12px;background:#f5f1eb;border:1px solid rgba(32,34,31,.07);font-size:12px;color:#5f5c56}
.empty{padding:24px 2px}.empty h2{font-size:22px;margin:0 0 7px;letter-spacing:-.03em}.empty p{margin:0}.zero{font-size:34px;font-weight:800;letter-spacing:-.05em}.line{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid rgba(32,34,31,.07);font-size:12px}.action{height:48px;border:0;border-radius:13px;padding:0 17px;background:#20221f;color:#fff;font-weight:750;cursor:pointer}.secondary{background:#fff;color:#20221f;border:1px solid rgba(32,34,31,.12)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.secure{font-size:11px;color:#7a776f;margin-top:12px}
.loading{min-height:60vh;display:grid;place-items:center;text-align:center}.loading strong{display:block;font-size:20px;margin-bottom:6px}
@media(max-width:900px){.body{grid-template-columns:1fr}.side{display:none}.main{padding:24px 18px}.grid{grid-template-columns:1fr}.hero h1{font-size:32px}.top{padding:0 18px}}
</style>
</head>
<body>
<div class="shell">
<header class="top">
<div class="brand">MERVEIL <span>PROFESSIONAL</span></div>
<div class="status" id="status"><i class="dot"></i><span>SECURE PASSPORT SESSION</span></div>
</header>
<div class="body">
<aside class="side">
<nav class="nav">
<button class="active" data-view="overview">Overview</button>
<button data-view="missions">Missions</button>
<button data-view="opportunities">Opportunities</button>
<button data-view="earnings">Earnings</button>
</nav>
<div class="passport-mini" id="mini"></div>
</aside>
<main class="main" id="app"><div class="loading"><div><strong>Opening your Citizen Passport</strong><span class="muted">Checking your secure Merveil session…</span></div></div></main>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://dixfybqlepticyudikuz.supabase.co";
const SUPABASE_KEY="sb_publishable_zOtxwZ1q_OCpiTunktzypw_14pQnQOh";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,passport=null,professional=null,view="overview",channel=null;
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const text=v=>v==null||v===""?"Not set":esc(v);
function initials(name){return String(name||"MC").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase()}
function goToCitizen(){window.location.href="/";}
function authScreen(title,copy,button="OPEN MERVEIL CITIZEN"){document.getElementById("app").innerHTML='<div class="loading"><div><strong>'+esc(title)+'</strong><p class="muted">'+esc(copy)+'</p><div class="actions" style="justify-content:center"><button class="action" onclick="goToCitizen()">'+esc(button)+'</button></div></div></div>';document.getElementById("mini").innerHTML=""}
async function load(){
 const s=await sb.auth.getSession(); user=s.data?.session?.user||null;
 if(!user){authScreen("Your Professional Passport is private","Sign in to Merveil Citizen first. Professional Services never creates a separate identity or anonymous professional account.");return}
 const p=await sb.from("profiles").select("id,name,email,junction_id,avatar_url,passport_tier,role_label,country,account_type,company_name,phone,profession,skills,languages,portfolio_url,website_url,city,is_freelancer,freelance_category,freelance_availability,freelance_rate,kyc_level,kyc_status,kyc_verified_at,trust_score,trust_level,trust_label,agent_verified,company_verified,rera_number,re_verified,merveil_credits,feeling,thought,last_seen_at").eq("id",user.id).maybeSingle();
 if(p.error||!p.data){authScreen("Complete your Citizen Passport","Professional Services only opens after a real Merveil Citizen profile exists. Finish the Citizen onboarding, then return here.");return}
 passport=p.data;
 const pr=await sb.from("professional_profiles").select("*").eq("user_id",user.id).maybeSingle(); professional=pr.data||null;
 render();
}
function renderMini(){
 const n=passport.name||user.email||"Merveil Citizen";
 document.getElementById("mini").innerHTML='<div class="avatar">'+(passport.avatar_url?'<img src="'+esc(passport.avatar_url)+'" alt="">':initials(n))+'</div><strong>'+text(passport.name||"Merveil Citizen")+'</strong><div class="muted">'+text(passport.profession||passport.role_label)+'</div><div class="muted" style="margin-top:6px">'+text(passport.city||passport.country)+'</div><div class="secure">Identity: '+text(passport.kyc_status||"not started")+'</div>';
}
function render(){
 renderMini();
 const n=passport.name||"Merveil Citizen";
 document.getElementById("status").innerHTML='<i class="dot"></i><span>'+((professional&&professional.online)?"ONLINE":"PASSPORT CONNECTED")+'</span>';
 const header='<div class="hero"><div><div class="eyebrow">CITIZEN PASSPORT → PROFESSIONAL SERVICES</div><h1>'+esc(view==="overview"?"Your professional identity":view==="missions"?"Missions":view==="opportunities"?"Opportunities":"Earnings")+'</h1></div><div class="pill">REAL DATA ONLY</div></div>';
 let body="";
 if(view==="overview") body=overview(n);
 if(view==="missions") body=missions();
 if(view==="opportunities") body=emptyView("Opportunities","Real opportunities appear here only when they exist in the Merveil network.");
 if(view==="earnings") body=earnings();
 document.getElementById("app").innerHTML=header+body;
}
function overview(n){
 const verified=passport.kyc_status==="verified"||!!passport.kyc_verified_at;
 const skills=Array.isArray(passport.skills)?passport.skills.filter(Boolean):[];
 const langs=Array.isArray(passport.languages)?passport.languages.filter(Boolean):[];
 const passportTier=passport.passport_tier||"standard";
 return '<div class="grid"><section class="card"><div class="identity"><div class="bigavatar">'+(passport.avatar_url?'<img src="'+esc(passport.avatar_url)+'" alt="">':initials(n))+'</div><div><div class="name">'+esc(n)+'</div><div class="meta">'+text(passport.junction_id)+' · '+text(passport.country||passport.city)+'</div><div class="badges"><span class="badge '+(verified?"good":"")+'">'+(verified?"✓ Identity verified":"Identity in progress")+'</span><span class="badge">'+esc(passportTier)+'</span></div></div></div><div class="rows"><div class="row"><span>Profession</span><span class="value">'+text(passport.profession||passport.role_label)+'</span></div><div class="row"><span>Company</span><span class="value">'+text(passport.company_name)+'</span></div><div class="row"><span>Account</span><span class="value">'+text(passport.account_type)+'</span></div><div class="row"><span>City</span><span class="value">'+text(passport.city)+'</span></div><div class="row"><span>Availability</span><span class="value">'+text(passport.freelance_availability)+'</span></div><div class="row"><span>Service category</span><span class="value">'+text(passport.freelance_category)+'</span></div></div></section><section class="card"><h3>Verification & trust</h3><div class="zero">'+Number(passport.trust_score||0)+'</div><div class="muted">'+text(passport.trust_label||passport.trust_level)+'</div><div class="rows"><div class="row"><span>Passport</span><span class="value">'+esc(passportTier)+'</span></div><div class="row"><span>KYC level</span><span class="value">'+text(passport.kyc_level)+'</span></div><div class="row"><span>KYC status</span><span class="value">'+text(passport.kyc_status)+'</span></div><div class="row"><span>Company verified</span><span class="value">'+(passport.company_verified?"Yes":"No")+'</span></div><div class="row"><span>RERA verified</span><span class="value">'+(passport.re_verified?"Yes":"No")+'</span></div></div><div class="secure">This screen reads your existing Citizen Passport. No second onboarding profile is created here.</div></section></div><section class="card section"><h3>Skills</h3><p class="muted">Taken directly from your Citizen Passport.</p><div class="chips">'+(skills.length?skills.map(x=>'<span class="chip">'+esc(x)+'</span>').join(""):'<span class="muted">0 skills listed</span>')+'</div></section><section class="card section"><h3>Languages</h3><p class="muted">Taken directly from your Citizen Passport.</p><div class="chips">'+(langs.length?langs.map(x=>'<span class="chip">'+esc(x)+'</span>').join(""):'<span class="muted">0 languages listed</span>')+'</div></section>';
}
async function missions(){
 const r=await sb.from("professional_missions").select("id,status,price,created_at,request_id").eq("professional_id",user.id).order("created_at",{ascending:false}).limit(20);
 const rows=r.data||[];
 if(r.error) return errorCard(r.error.message);
 if(!rows.length) return emptyView("No active missions","0 real missions are currently assigned to this Passport. Nothing is simulated.");
 return '<section class="card"><h3>Real missions</h3><div class="rows">'+rows.map(x=>'<div class="row"><span>'+esc(x.status||"unknown")+'</span><span class="value">'+esc(x.id)+' · '+(x.price==null?"AED 0":"AED "+esc(x.price))+'</span></div>').join("")+'</div></section>';
}
async function earnings(){
 const r=await sb.from("professional_mission_financials").select("mission_id,professional_earnings,payout_status,payment_status,currency").in("mission_id",(await sb.from("professional_missions").select("id").eq("professional_id",user.id))).limit(50);
 if(r.error) return errorCard(r.error.message);
 const rows=r.data||[];
 const total=rows.reduce((a,x)=>a+Number(x.professional_earnings||0),0);
 return '<section class="card"><h3>Real earnings</h3><div class="zero">AED '+total.toFixed(2)+'</div><div class="muted">'+rows.length+' financial records</div><div class="secure">No earnings are invented. With no financial records, this remains AED 0.00.</div></section>';
}
function emptyView(title,copy){return '<section class="card empty"><h2>'+esc(title)+'</h2><p class="muted">'+esc(copy)+'</p><div class="actions"><button class="action secondary" onclick="render()">REFRESH</button></div></section>'}
function errorCard(msg){return '<section class="card empty"><h2>Live data unavailable</h2><p class="muted">'+esc(msg||"The real service could not be read.")+'</p><div class="actions"><button class="action secondary" onclick="render()">RETRY</button></div></section>'}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");view=b.dataset.view;render()}));
async function subscribe(){
 if(!user)return;
 if(channel) await sb.removeChannel(channel);
 channel=sb.channel("professional-passport-"+user.id);
 channel.on("postgres_changes",{event:"*",schema:"public",table:"profiles",filter:"id=eq."+user.id},load);
 channel.on("postgres_changes",{event:"*",schema:"public",table:"professional_profiles",filter:"user_id=eq."+user.id},load);
 channel.on("postgres_changes",{event:"*",schema:"public",table:"professional_missions",filter:"professional_id=eq."+user.id},render);
 channel.subscribe();
}
sb.auth.onAuthStateChange(async()=>{await load();await subscribe()});
window.addEventListener("focus",load);
window.addEventListener("online",load);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")load()});
setInterval(()=>{if(document.visibilityState==="visible")load()},15000);
load().then(subscribe);
</script>
</body>
</html>
