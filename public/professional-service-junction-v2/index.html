<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Merveil Professional — Field Network</title>
<meta name="theme-color" content="#050505">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050505;color:#f5f5f5;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}
body{min-height:100vh}.shell{min-height:100vh;background:#050505}.top{height:72px;border-bottom:1px solid #202020;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;background:rgba(5,5,5,.92);backdrop-filter:blur(16px);z-index:5}.brand{font-weight:800;letter-spacing:-.03em}.brand span{color:#777;font-weight:500}.status{display:flex;gap:10px;align-items:center;font-size:12px;color:#aaa}.dot{width:8px;height:8px;border-radius:50%;background:#63e6be;box-shadow:0 0 12px #63e6be}.body{display:grid;grid-template-columns:260px 1fr 330px;min-height:calc(100vh - 72px)}.side{border-right:1px solid #202020;padding:28px 18px}.nav{display:grid;gap:7px}.nav button{background:transparent;border:0;color:#777;text-align:left;padding:13px 14px;border-radius:12px;cursor:pointer}.nav button.active,.nav button:hover{background:#151515;color:#fff}.profile{margin-top:30px;padding:16px;border:1px solid #242424;border-radius:16px;background:#0b0b0b}.avatar{width:42px;height:42px;border-radius:50%;background:#222;display:grid;place-items:center;font-weight:800;margin-bottom:12px}.muted{color:#777;font-size:12px}.main{padding:30px;max-width:920px;width:100%;margin:auto}.eyebrow{font-size:11px;letter-spacing:.14em;color:#777;text-transform:uppercase}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:28px}.hero h1{font-size:38px;line-height:1;margin:9px 0 0;letter-spacing:-.045em}.pill{border:1px solid #292929;background:#0d0d0d;border-radius:999px;padding:9px 13px;color:#aaa;font-size:12px}.mission{border:1px solid #2b2b2b;border-radius:24px;background:linear-gradient(145deg,#111,#090909);padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.28)}.missionTop{display:flex;justify-content:space-between;gap:15px}.service{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:8px 0}.money{font-size:25px;font-weight:800}.meta{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}.tag{border:1px solid #282828;background:#0b0b0b;padding:8px 10px;border-radius:10px;color:#bbb;font-size:12px}.route{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:24px 0}.routeLine{height:1px;background:#292929}.action{width:100%;height:52px;border:0;border-radius:14px;background:#f4f4f4;color:#080808;font-weight:800;cursor:pointer}.action:hover{background:#fff}.ghost{background:#111;color:#fff;border:1px solid #292929;margin-top:9px}.right{border-left:1px solid #202020;padding:28px 20px}.card{border:1px solid #242424;border-radius:18px;background:#0b0b0b;padding:18px;margin-bottom:14px}.card h3{margin:0 0 14px;font-size:14px}.metric{font-size:28px;font-weight:800}.smallrow{display:flex;justify-content:space-between;color:#999;font-size:12px;padding:10px 0;border-bottom:1px solid #1d1d1d}.smallrow:last-child{border-bottom:0}.map{height:180px;border-radius:15px;background:radial-gradient(circle at 35% 45%,#252525 0 2px,transparent 3px),linear-gradient(135deg,#0b0b0b,#151515);position:relative;overflow:hidden}.map:after{content:"DEIRA";position:absolute;left:20px;bottom:18px;color:#666;font-size:11px;letter-spacing:.16em}.pulse{position:absolute;left:35%;top:40%;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 0 8px rgba(255,255,255,.08),0 0 25px rgba(255,255,255,.55)}.mode{display:flex;gap:8px}.mode button{flex:1;padding:9px;border-radius:10px;border:1px solid #292929;background:#0b0b0b;color:#888;cursor:pointer}.mode button.active{background:#fff;color:#050505}.demo{position:fixed;bottom:18px;right:18px;background:#fff;color:#050505;border:0;border-radius:999px;padding:11px 15px;font-weight:800;cursor:pointer;box-shadow:0 10px 35px rgba(0,0,0,.4)}
@media(max-width:1000px){.body{grid-template-columns:1fr}.side,.right{display:none}.main{padding:20px}.hero h1{font-size:30px}.top{padding:0 18px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand">MERVEIL <span>PROFESSIONAL</span></div><div class="status"><i class="dot"></i> ONLINE · DEIRA</div></header>
<div class="body">
<aside class="side">
<nav class="nav">
<button class="active" onclick="show('missions',this)">Missions</button>
<button onclick="show('day',this)">My Day</button>
<button onclick="show('opportunities',this)">Opportunities</button>
<button onclick="show('wallet',this)">Earnings</button>
</nav>
<div class="profile"><div class="avatar">A</div><strong>Ahmed</strong><div class="muted">AC Technician · Verified</div><div class="muted" style="margin-top:10px">Motorcycle · Deira / Karama</div></div>
</aside>
<main class="main" id="app"></main>
<aside class="right">
<div class="card"><h3>LIVE NETWORK</h3><div class="metric">2.4 km</div><div class="muted">current mission distance</div><div class="smallrow"><span>Service</span><b>AC maintenance</b></div><div class="smallrow"><span>ETA</span><b>8 min</b></div><div class="smallrow"><span>Mission</span><b>#M-28491</b></div></div>
<div class="card"><h3>PROPERTY</h3><div class="map"><div class="pulse"></div></div><div style="margin-top:12px"><b>Al Rigga · Deira</b><div class="muted">Apartment owner · Service request</div></div></div>
<div class="card"><h3>WORK MODE</h3><div class="mode"><button class="active">Online</button><button>Offline</button></div></div>
</aside>
</div>
</div>
<button class="demo" onclick="advance()">▶ Run live mission</button>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=window.supabase.createClient("https://dixfybqlepticyudikuz.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRpeGZ5YnFsZXB0aWN5dWRpa3V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNDM2NzQsImV4cCI6MjA5OTcxOTY3NH0._U9bEobzrQbdHxyu6NiRsvGzzeCmXaEX7HvJZJisSqg");
let user=null,mission=null,profile=null;
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function rpc(fn,args){const {data,error}=await sb.rpc(fn,args||{});if(error)throw error;return data}
function ui(title,eyebrow,body){document.getElementById("app").innerHTML='<div class="hero"><div><div class="eyebrow">'+esc(eyebrow)+'</div><h1>'+esc(title)+'</h1></div><div class="pill">REAL NETWORK</div></div>'+body}
async function loadProfile(){const r=await sb.from("professional_profiles").select("*").eq("user_id",user.id).maybeSingle();profile=r.data; if(profile){document.querySelector(".profile strong").textContent=profile.display_name||"Professional";document.querySelector(".profile .muted").textContent=profile.headline||"Professional";document.querySelector(".status").innerHTML='<i class="dot"></i> '+(profile.online?"ONLINE":"OFFLINE")}}
async function loadMission(){const r=await sb.from("professional_missions").select("*,service_requests:request_id(description,priority,service_id,professional_services:service_id(name))").eq("professional_id",user.id).in("status",["assigned","travelling","arrived","in_progress","completed"]).order("created_at",{ascending:false}).limit(1);mission=r.data?.[0]||null}
async function render(){
 if(!profile){ui("Professional onboarding","PROFILE","<section class='mission'><p class='muted'>No professional profile exists yet. Create your real profile before receiving missions.</p><button class='action' onclick='onboard()'>START ONBOARDING</button></section>");return}
 await loadMission();
 if(!mission){ui("Ready for work","MISSIONS","<section class='mission'><div class='service'>No active mission</div><p class='muted'>No simulated missions are shown. Real offers appear after a citizen request is matched to your capability, availability and location.</p><button class='action' onclick='render()'>REFRESH</button></section>");return}
 const s=mission.status, req=mission.service_requests||{}, next={assigned:["travelling","START TRAVEL"],travelling:["arrived","MARK ARRIVED"],arrived:["in_progress","START SERVICE"],in_progress:["completed","COMPLETE SERVICE"],completed:[null,"WAITING FOR CUSTOMER"]}[s];
 let status={};try{status=await rpc("get_professional_mission_status",{p_mission_id:mission.id})}catch(e){}
 document.querySelector(".metric").textContent=status.distance_km!=null?Number(status.distance_km).toFixed(1)+" km":"—";
 document.querySelector(".smallrow b").textContent=req.professional_services?.name||"—";
 ui(req.professional_services?.name||"Professional service",s.toUpperCase(),"<section class='mission'><div class='missionTop'><div><div class='service'>"+esc(req.description||"Service request")+"</div><div class='muted'>Mission #"+esc(mission.id)+"</div></div><div class='money'>"+(mission.price!=null?"AED "+esc(mission.price):"—")+"</div></div><div class='meta'><span class='tag'>"+esc(req.priority||"normal")+"</span><span class='tag'>"+(status.distance_km!=null?Number(status.distance_km).toFixed(1)+" km":"Location pending")+"</span><span class='tag'>"+(status.eta_minutes!=null?"~"+status.eta_minutes+" min ETA":"ETA pending")+"</span></div><div class='route'><span class='muted'>CUSTOMER</span><div class='routeLine'></div><span class='muted'>PROFESSIONAL</span></div><button class='action' "+(next[0]?"onclick='advance(\""+next[0]+"\")'":"disabled")+">"+esc(next[1])+"</button><button class='action ghost' onclick='render()'>REFRESH STATUS</button></section><div class='card' style='margin-top:16px'><div class='eyebrow'>REAL EVENT STREAM</div><div id='events' class='muted'>Loading…</div></div>");
 try{const ev=await rpc("get_professional_mission_events",{p_mission_id:mission.id});document.getElementById("events").innerHTML=(ev||[]).map(e=>"<div class='smallrow'><span>"+esc(e.event_type)+"</span><b>"+new Date(e.created_at).toLocaleString()+"</b></div>").join("")||"No events."}catch(e){document.getElementById("events").textContent=e.message}
}
async function advance(to){try{await rpc("transition_mission",{p_mission_id:mission.id,p_to_status:to});await render()}catch(e){alert(e.message)}}
async function onboard(){ui("Create your professional profile","ONBOARDING","<section class='mission'><div class='field'><label>DISPLAY NAME</label><input id='od' placeholder='Your name'></div><div class='field'><label>HEADLINE</label><input id='oh' placeholder='AC Technician'></div><div class='field'><label>HOME AREA</label><input id='oa' placeholder='Deira'></div><div class='field'><label>VEHICLE</label><input id='ov' placeholder='Motorcycle'></div><div class='field'><label>SERVICE RADIUS (KM)</label><input id='or' type='number' value='10'></div><button class='action' onclick='saveProfile()'>SAVE PROFILE</button></section>")}
async function saveProfile(){try{await rpc("upsert_professional_profile",{p_display_name:document.getElementById("od").value,p_headline:document.getElementById("oh").value,p_home_area:document.getElementById("oa").value,p_vehicle_type:document.getElementById("ov").value,p_service_radius_km:Number(document.getElementById("or").value)});await loadProfile();render()}catch(e){alert(e.message)}}
async function setOnline(v){try{await rpc("set_professional_online",{p_online:v});await loadProfile();render()}catch(e){alert(e.message)}}
async function locate(){navigator.geolocation?.getCurrentPosition(async p=>{try{await rpc("update_professional_location",{p_latitude:p.coords.latitude,p_longitude:p.coords.longitude,p_accuracy_m:p.coords.accuracy||null,p_heading:p.coords.heading||null,p_speed_kmh:p.coords.speed?3.6*p.coords.speed:null});await render()}catch(e){alert(e.message)}},e=>alert(e.message),{enableHighAccuracy:true})}
document.querySelector(".demo").textContent="↻ Refresh live network";document.querySelector(".demo").onclick=render;
document.querySelectorAll(".mode button")[0].onclick=()=>setOnline(true);document.querySelectorAll(".mode button")[1].onclick=()=>setOnline(false);
document.querySelector(".right .card:nth-child(2) .map").onclick=locate;
sb.auth.onAuthStateChange(async(e,s)=>{user=s?.user||null;if(user){await loadProfile();document.querySelector(".shell").style.display="block";await render()}else{document.querySelector(".shell").style.display="block";ui("Sign in required","MERVEIL PROFESSIONAL","<section class='mission'><p class='muted'>The professional interface is now connected to the real backend. Sign in through the Merveil account flow to continue.</p></section>")}});
document.querySelectorAll(".nav button").forEach((b,i)=>b.onclick=async()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");if(i===0)render();else ui(b.textContent.toUpperCase(),b.textContent,"<section class='mission'><p class='muted'>This surface is data-driven. No fabricated missions, opportunities or earnings are displayed.</p><button class='action' onclick='render()'>BACK TO MISSIONS</button></section>")});
</script></body></html>
